name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, gd, zip, bcmath, intl, exif
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      # tailwind.config.js replaces Tailwind's scales rather than extending them, so a
      # class outside them compiles to nothing with no warning. Diff the templates against
      # the stylesheet that was just built. See docs/10-UI-UX-AUDIT.md §7.
      - name: Dead-class check
        run: npm run check:classes

      - name: Directory permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Pint (code style)
        run: ./vendor/bin/pint --test

      - name: Larastan (static analysis, level 5)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Pest (tests)
        run: ./vendor/bin/pest --ci
