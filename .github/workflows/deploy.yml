name: Deploy to Hostinger

# Deploys on every push to main. `workflow_dispatch` is kept so you can still
# re-run a deploy by hand from the Actions tab without pushing a commit.
#
# Day-to-day flow: work on develop, then merge develop -> main to release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys overlap: deploy.sh runs `artisan migrate`, and two
# concurrent migration runs against the same database can interleave and
# half-apply a schema change. Queue them instead — and never cancel one
# mid-flight, which could leave the site in maintenance mode with `artisan
# down` already called but `artisan up` never reached.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT }}" "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync built assets to server
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.DEPLOY_SSH_PORT }}" \
            public/build/ \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ secrets.DEPLOY_APP_DIR }}/public/build/"

      - name: Run deploy.sh on the server
        # PHP_BIN — deploy.sh defaults to whatever `php` resolves to in PATH, which on
        # Hostinger's CloudLinux shared hosting is the ACCOUNT'S default PHP Selector
        # version (8.2 here), not necessarily the version the domain itself is configured
        # to serve under (8.4, set via hPanel → PHP Configuration — see
        # docs/04-DEPLOYMENT-HOSTINGER.md). Without this, `composer install`/`artisan
        # migrate` on an automated deploy silently run against the wrong PHP version.
        # DEPLOY_PHP_BIN is optional — falls back to plain `php` if unset, same as before.
        run: |
          ssh -p "${{ secrets.DEPLOY_SSH_PORT }}" "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "APP_DIR=${{ secrets.DEPLOY_APP_DIR }} PHP_BIN=${{ secrets.DEPLOY_PHP_BIN }} bash ${{ secrets.DEPLOY_APP_DIR }}/deploy.sh"
